name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        # GitHub 托管 macOS runner 上 py3.12 作业多次排队 15 分钟后被取消（见 docs/ci.md 排障），
        # macOS 平台覆盖保留在 Python 3.11；3.12 覆盖率门禁由 ubuntu/windows 承担。
        exclude:
          - os: macos-latest
            python-version: "3.12"

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 零第三方运行时依赖：本仓库 CI 全部使用标准库脚本。
      - name: CI readiness check (workflow matrix + git remote)
        run: python scripts/ci_ready.py --require-remote

      - name: CI gates (compile, doc-links, FR mapping, tests, coverage, doctor, bench, brand-guard, reproducible build)
        run: python scripts/run_ci.py

      - name: Build release package
        run: python scripts/build_release.py

      - name: Package smoke
        run: python scripts/package_smoke.py

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/workbench-*.zip
          if-no-files-found: error
          retention-days: 7
